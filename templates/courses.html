{% extends "base.html" %}
{% block title %}Courses & Videos{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto p-6 mb-10">
  <!-- Heading -->
  <h1 class="text-4xl font-bold text-emerald-700 dark:text-white text-center mb-4 animate__animated animate__fadeInUp">
    🎓 Courses & Video Suggestions
  </h1>
  <p class="text-gray-800 dark:text-gray-200 text-center mb-8 animate__animated animate__fadeInUp animate__delay-1s">
    Explore courses related to your degree and skillset. Click on a course to view curated high-quality video tutorials from top creators.
  </p>

  <!-- Search Box -->
  <div class="flex justify-center mb-6">
    <input type="text" id="courseSearch" placeholder="Search Course..." 
           class="px-4 py-2 rounded-l-xl border border-emerald-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none dark:bg-gray-700 dark:text-white">
    <button id="searchBtn" 
            class="px-6 py-2 bg-emerald-600 text-white rounded-r-xl hover:bg-emerald-700 transition">Search</button>
  </div>

  <!-- Loader -->
  <div id="loader" class="hidden flex justify-center my-4">
    <svg class="animate-spin h-8 w-8 text-emerald-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
    </svg>
  </div>

  <!-- Courses Grid -->
  <div id="coursesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <!-- Course Cards will be populated here by JS -->
  </div>
</div>

<script>
const courses = [
  {
    name: "Google SRE / Cloud",
    degree: "B.Tech / M.Tech (CS/IT)",
    videos: [
      { title: "Site Reliability Engineering - Full Course", link: "https://www.youtube.com/watch?v=3HYoJdIm2gA" },
      { title: "Google Cloud SRE Practices", link: "https://www.youtube.com/watch?v=PNh6-7Es4Lc" },
    ]
  },
  {
    name: "Amazon Supply Chain & Operations",
    degree: "MBA (Operations)",
    videos: [
      { title: "Supply Chain Management Basics", link: "https://www.youtube.com/watch?v=7pNYhD7EIjk" },
      { title: "Amazon Operations Case Study", link: "https://www.youtube.com/watch?v=H9mS-YH8S4s" },
    ]
  },
  {
    name: "Microsoft Power Platform",
    degree: "BCA / MCA",
    videos: [
      { title: "Power Apps Full Tutorial", link: "https://www.youtube.com/watch?v=uZl0U9Vf9zI" },
      { title: "Power Automate Beginner to Advanced", link: "https://www.youtube.com/watch?v=W5dn8u5FJcI" },
    ]
  },
  {
    name: "TCS SAP Consultant",
    degree: "MBA / M.Com",
    videos: [
      { title: "SAP Functional Consultant Tutorial", link: "https://www.youtube.com/watch?v=Jf9_S7BZgJQ" },
      { title: "SAP Modules Overview", link: "https://www.youtube.com/watch?v=8gTZECXl7qE" },
    ]
  },
  {
    name: "Infosys Python Automation",
    degree: "B.Sc (IT) / B.Tech",
    videos: [
      { title: "Python Automation Projects for Beginners", link: "https://www.youtube.com/watch?v=rfscVS0vtbw" },
      { title: "Automation Scripts with Python", link: "https://www.youtube.com/watch?v=HW29067qVWk" },
    ]
  },
  {
    name: "Communication & Interview Skills",
    degree: "All Degrees",
    videos: [
      { title: "Improve Communication Skills", link: "https://www.youtube.com/watch?v=Zb7T9Gk6s3U" },
      { title: "Interview Preparation Tips", link: "https://www.youtube.com/watch?v=Od0l0xN3rG0" },
      { title: "Group Discussion Techniques", link: "https://www.youtube.com/watch?v=vQxquf4Plyc" },
    ]
  },
  {
    name: "Aptitude Preparation",
    degree: "All Degrees",
    videos: [
      { title: "Aptitude Basics", link: "https://www.youtube.com/watch?v=qyj9A-12c6g" },
      { title: "Quantitative Aptitude Tricks", link: "https://www.youtube.com/watch?v=c2NZfrvFjhU" },
    ]
  }
];

// Function to populate courses
function showCourses(list) {
  const container = document.getElementById("coursesContainer");
  container.innerHTML = "";
  list.forEach(course => {
    const card = document.createElement("div");
    card.className = "bg-white dark:bg-gray-800 border border-emerald-300 dark:border-gray-600 rounded-xl shadow-lg p-4 cursor-pointer transition hover:shadow-2xl hover:bg-emerald-50 dark:hover:bg-emerald-700";
    card.innerHTML = `
      <h2 class="text-xl font-bold text-emerald-700 dark:text-white mb-1">${course.name}</h2>
      <p class="text-gray-600 dark:text-gray-300 mb-2">${course.degree}</p>
      <div class="videoList hidden mt-2 space-y-2">
        ${course.videos.map(v => `
          <a href="${v.link}" target="_blank" class="flex items-center gap-2 px-3 py-1 bg-emerald-100 dark:bg-gray-700 dark:text-white rounded-lg hover:bg-emerald-200 dark:hover:bg-emerald-600 transition">
            <span>🎬</span>${v.title}
          </a>`).join('')}
      </div>
    `;
    card.addEventListener("click", () => {
      const list = card.querySelector(".videoList");
      list.classList.toggle("hidden");
    });
    container.appendChild(card);
  });
}

// Initial display
showCourses(courses);

// Search functionality
document.getElementById("searchBtn").addEventListener("click", () => {
  const query = document.getElementById("courseSearch").value.toLowerCase();
  const filtered = courses.filter(c => c.name.toLowerCase().includes(query));
  const loader = document.getElementById("loader");
  loader.classList.remove("hidden");

  setTimeout(() => {
    loader.classList.add("hidden");
    showCourses(filtered.length ? filtered : courses);
  }, 700); // simulate loader delay
});
</script>
{% endblock %}
