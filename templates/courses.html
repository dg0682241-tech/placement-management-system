{% extends "base.html" %}
{% block title %}Courses & Videos{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto p-6 mb-10">
  <!-- Heading -->
  <h1 class="text-4xl font-bold text-emerald-700 dark:text-white text-center mb-4 animate__animated animate__fadeInUp">
    🎓 Courses & Video Suggestions
  </h1>
  <p class="text-gray-800 dark:text-gray-200 text-center mb-8 animate__animated animate__fadeInUp animate__delay-1s">
    Explore courses related to your degree and skillset. Click on a course to view curated high-quality video tutorials from top creators.
  </p>

  <!-- Search Box -->
  <div class="flex justify-center mb-6">
    <input type="text" id="courseSearch" placeholder="Search Course..." 
           class="px-4 py-2 rounded-l-xl border border-emerald-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none dark:bg-gray-700 dark:text-white">
    <button id="searchBtn" 
            class="px-6 py-2 bg-emerald-600 text-white rounded-r-xl hover:bg-emerald-700 transition">Search</button>
  </div>

  <!-- Loader -->
  <div id="loader" class="hidden flex justify-center my-4">
    <svg class="animate-spin h-8 w-8 text-emerald-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
    </svg>
  </div>

  <!-- Courses Grid -->
  <div id="coursesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <!-- Course Cards will be populated here by JS -->
  </div>
</div>

<script>
const courses = [
  {
    name: "Communication Skills",
    videos: [
      { title: "Verbal Communication Basics", link: "https://www.youtube.com/watch?v=Zb7T9Gk6s3U" },
      { title: "Professional Speaking Skills", link: "https://www.youtube.com/watch?v=R2xZyP3E7Xc" },
      { title: "Public Speaking Confidence", link: "https://www.youtube.com/watch?v=Io6JjgckHbg" }
    ]
  },
  {
    name: "Body Language & Personality",
    videos: [
      { title: "Body Language for Interviews", link: "https://www.youtube.com/watch?v=4jwUXV4QaTw" },
      { title: "Confident Posture & Gestures", link: "https://www.youtube.com/watch?v=Yc8mGZ0ZsEo" },
      { title: "Reading Human Behavior", link: "https://www.youtube.com/watch?v=ZsZJ9J8RZtU" }
    ]
  },
  {
    name: "Interview Preparation",
    videos: [
      { title: "HR Interview Questions & Answers", link: "https://www.youtube.com/watch?v=Od0l0xN3rG0" },
      { title: "Technical Interview Strategy", link: "https://www.youtube.com/watch?v=KUK8HpM8R28" },
      { title: "Mock Interview Tips", link: "https://www.youtube.com/watch?v=Rz1R4Hk6z9s" }
    ]
  },
  {
    name: "Aptitude (All Types)",
    videos: [
      { title: "Quantitative Aptitude Full Course", link: "https://www.youtube.com/watch?v=qyj9A-12c6g" },
      { title: "Logical Aptitude Concepts", link: "https://www.youtube.com/watch?v=c2NZfrvFjhU" },
      { title: "Verbal Aptitude Practice", link: "https://www.youtube.com/watch?v=K0BzZzTz7kM" }
    ]
  },
  {
    name: "Reasoning Skills",
    videos: [
      { title: "Logical Reasoning Basics", link: "https://www.youtube.com/watch?v=vQxquf4Plyc" },
      { title: "Analytical Reasoning Problems", link: "https://www.youtube.com/watch?v=3xZ8zF2D9kE" },
      { title: "Critical Thinking Skills", link: "https://www.youtube.com/watch?v=H8j2YyP9Q7A" }
    ]
  },
  {
    name: "Python Programming",
    videos: [
      { title: "Python Full Course for Beginners", link: "https://www.youtube.com/watch?v=rfscVS0vtbw" },
      { title: "Python for Problem Solving", link: "https://www.youtube.com/watch?v=HGOBQPFzWKo" },
      { title: "Python Mini Projects", link: "https://www.youtube.com/watch?v=8ext9G7xspg" }
    ]
  },
  {
    name: "SQL & Databases",
    videos: [
      { title: "SQL Complete Tutorial", link: "https://www.youtube.com/watch?v=HXV3zeQKqGY" },
      { title: "Joins, Subqueries & Indexes", link: "https://www.youtube.com/watch?v=9yeOJ0ZMUYw" },
      { title: "Database Design Concepts", link: "https://www.youtube.com/watch?v=ztHopE5Wnpc" }
    ]
  },
  {
    name: "Web Development Fundamentals",
    videos: [
      { title: "HTML & CSS Crash Course", link: "https://www.youtube.com/watch?v=UB1O30fR-EE" },
      { title: "JavaScript Basics", link: "https://www.youtube.com/watch?v=PkZNo7MFNFg" },
      { title: "Frontend Project Walkthrough", link: "https://www.youtube.com/watch?v=Q33KBiDriJY" }
    ]
  }
];

// Render courses
function showCourses(list) {
  const container = document.getElementById("coursesContainer");
  container.innerHTML = "";

  list.forEach(course => {
    const card = document.createElement("div");
    card.className =
      "bg-white dark:bg-gray-800 border border-emerald-300 dark:border-gray-600 rounded-xl shadow-lg p-4 cursor-pointer transition hover:shadow-2xl hover:bg-emerald-50 dark:hover:bg-emerald-700";

    card.innerHTML = `
      <h2 class="text-xl font-bold text-emerald-700 dark:text-white mb-2">
        ${course.name}
      </h2>

      <div class="videoList hidden mt-2 space-y-2">
        ${course.videos
          .map(
            v => `
          <a href="${v.link}" target="_blank"
            class="flex items-center gap-2 px-3 py-1 bg-emerald-100 dark:bg-gray-700 dark:text-white rounded-lg hover:bg-emerald-200 dark:hover:bg-emerald-600 transition">
            <span>🎥</span>
            ${v.title}
          </a>`
          )
          .join("")}
      </div>
    `;

    card.addEventListener("click", () => {
      card.querySelector(".videoList").classList.toggle("hidden");
    });

    container.appendChild(card);
  });
}

// Initial load
showCourses(courses);

// Search with loader
document.getElementById("searchBtn").addEventListener("click", () => {
  const query = document.getElementById("courseSearch").value.toLowerCase();
  const loader = document.getElementById("loader");
  loader.classList.remove("hidden");

  setTimeout(() => {
    loader.classList.add("hidden");
    const filtered = courses.filter(c =>
      c.name.toLowerCase().includes(query)
    );
    showCourses(filtered.length ? filtered : courses);
  }, 700);
});
</script>

{% endblock %}
